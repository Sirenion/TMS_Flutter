name: homework
description: "TMS homework"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  path: ^1.9.1
  json_serializable: ^6.12.0
  json_annotation: ^4.10.0
  go_router: ^17.1.0
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  build_runner: ^2.10.5
  mobx_codegen: ^2.7.6
  redux: ^5.0.0
  flutter_redux: ^0.10.0
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
  fonts:
    - family: GoogleSans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/GoogleSans-Italic.ttf
          style: italic